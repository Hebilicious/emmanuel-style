# The front page: the site's facts, the Library it leads with, and the latest
# dispatch with its plate.
query Home {
	site {
		name
		tagline
	}
	posts {
		slug
		title
		description
		date
		tags
		blocks {
			id
			kind
			image
			caption
		}
	}
	shelves {
		slug
		projects {
			name
			title
			kind
			featured
			contributions
			activity
			cover
		}
	}
}
