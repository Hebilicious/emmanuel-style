# The Library: every shelf with its projects, as the front page and the shelves
# show them. The front page is the projects with a `featured` place, in its order,
# and the first of them leads with the opening of its text.
query Library {
	shelves {
		slug
		label
		blurb
		projects {
			name
			title
			tagline
			body
			kind
			shelf
			language
			url
			homepage
			archived
			repo
			started
			ended
			featured
			contributions
			activity
			cover
		}
	}
}
