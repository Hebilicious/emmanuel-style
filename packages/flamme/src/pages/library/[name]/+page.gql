# One project, in full, and the order of the Library around it, for the
# previous and the next project at the foot of its page.
query Project($name: String!) {
	project(name: $name) {
		name
		title
		tagline
		body
		points
		kind
		shelf
		language
		stack
		url
		homepage
		archived
		repo
		started
		ended
		featured
		contributions
		activity
		links {
			label
			url
			date
		}
		cover
	}
	shelves {
		slug
		label
		projects {
			name
			title
		}
	}
}
