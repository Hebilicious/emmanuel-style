[package]
name = "flamme-napi"
description = "napi-rs binding for the Flamme Rust compiler (one JSON-in/JSON-out entry point)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
flamme-core = { workspace = true }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"
