    "@astrojs/markdown-remark": "7.3.1"
    "@microflash/rehype-figure": "2.1.4"
    "@vueuse/core": "15.0.0"
    "astro": "7.3.3"
    "rehype-autolink-headings": "7.1.0"
    "rehype-slug": "6.0.0"
    "vue": "3.5.42"
