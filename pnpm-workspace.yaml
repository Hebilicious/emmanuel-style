packages:
  - 'packages/*'
  # Flamme is vendored, not published: the workspace is the only source of it, and
  # the Astro package stays in place beside the new one so the two can be compared.
  - 'vendor/flamme/*'

# One version of Vue and its router for the whole workspace. The vendored framework
# packages resolve their peers against these, so no second copy can appear through a
# different peer set: two copies mean two sets of injection keys, and a `RouterView`
# then cannot find the router it is rendered under.
overrides:
  vue: 3.5.42
  vue-router: 5.3.1

allowBuilds:
  dprint: true
  esbuild: true
  lefthook: true
  workerd: true

